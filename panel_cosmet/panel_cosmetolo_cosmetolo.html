<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="contenedor"></div>
        <aside class="contenedor_lateral">
            <div class="cont_logo">
                <img src="../../imagenes/logo.png" alt="">
                <p>Cosmetología y Estética Integral</p>
            </div>
            <button class="boton_logo">
                <a href="index.html">Cerrar sesion</a>
            </button>
            <nav class="nav_logo">
                <button class="button_nav_logo" >
                    <a href="panel_inicio_usuario.html">Panel de inicio</a>
                </button>
                <button class="button_nav_logo" >
                    <a href="panel_cosmet_usuario.html">Cosmetologo/a</a>
                </button>
                <button class="button_nav_logo" >
                    <a href="panel_Servici_usuario.html">Servicios</a>
                </button>
                <button class="button_nav_logo" >
                    <a href="panel_Citas_usuario.html">Citas</a>
                </button>
                <button class="button_nav_logo" >
                    <a href="panel_confing_usuario.html">Configuracios</a>
                </button>
            </nav>
        </aside>
        <main class="cont_logo">
            <div class="panel">
                <div class="contenido_principal">
                    <h2 class="h2_principal">Panel cosmetologo</h2><div class="cont_reservar">
                        <form>
                            <p class="p_principal">Perfil</p>
                            
                            <label for="nombre"></label>
                            <input type="text" id="nombre" name="nombre" placeholder="Nombre" autocomplete="off">
                        
                            <label for="apellidos"></label>
                            <input type="text" id="apellidos" name="apellidos" placeholder="Apellidos" autocomplete="off">
                        
                            <label for="edad"></label>
                            <input type="number" id="edad" name="edad" placeholder="Edad" autocomplete="off">
                        
                            <label for="genero"></label>
                            <select id="genero" name="genero">
                                <option value="">Género</option>
                                <option value="1">Masculino</option>
                                <option value="2">Femenino</option>
                                <option value="3">Otro</option>
                            </select>

                            <label for="telefono"></label>
                            <input type="number" id="telefono" name="telefono" placeholder="Número de teléfono" autocomplete="off">
                        
                            <label for="email"></label>
                            <input type="text" id="email" name="email" placeholder="Email" autocomplete="off">
                        
                            <button type="summit" id="summit">
                                <a href="/panel_admin/panel_inicio_admin.html">Registrarse</a>
                            </button>  
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
